name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Restore, build, test and publish (WASM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install wasm-tools workload
        # Required by the WebAssembly sample: it links SkiaSharp's native library
        # (WasmBuildNative=true) so the SKGLView surface is hardware accelerated.
        run: dotnet workload install wasm-tools

      - name: Restore
        run: dotnet restore RPGEngine.sln

      - name: Build (Release, full solution)
        run: dotnet build RPGEngine.sln -c Release

      - name: Test (Release)
        run: dotnet test RPGEngine.sln -c Release --no-build

      - name: Publish WebAssembly sample (Release, browser-wasm)
        run: dotnet publish samples/RPGEngine.Sample.Wasm -c Release -r browser-wasm
